<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정책실">
<meta name="theme-color" content="#1E3A5F">
<title>말씀함께 정책실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root {
  --bg: #EDF2F8;
  --surface: #FFFFFF;
  --ink: #18212C;
  --ink-soft: #5B6878;
  --line: #D3DCE7;
  --head: #1E3A5F;          /* 머리줄 (단색) */
  --head-ink: #F2F6FB;
  --vine: #2B63A6;          /* Choi 말풍선 */
  --vine-ink: #F5F9FE;
  --kang: #4A5A8C;          /* Kang 말풍선 */
  --kang-ink: #F3F5FB;
  --agent-rule: #5B8FD0;    /* 에이전트 메모 왼쪽 줄 */
  --decide: #9A5B0C;        /* 결정 요청 */
  --decide-bg: #FBF3E6;
  --ok: #3F7A3A;
  --danger: #A2352B;
  --chip: #E1E8F1;
  --radius-bubble: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F141B;
    --surface: #18202B;
    --ink: #E4EAF2;
    --ink-soft: #97A3B3;
    --line: #2A3442;
    --head: #16273D;
    --head-ink: #EAF0F8;
    --vine: #3A73B8;
    --vine-ink: #F5F9FE;
    --kang: #56669B;
    --kang-ink: #F3F5FB;
    --agent-rule: #7DA9E0;
    --decide: #E3A24A;
    --decide-bg: #2A2215;
    --ok: #7DBA74;
    --danger: #E07A6F;
    --chip: #232E3C;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Gowun Dodum", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--agent-rule); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }

/* 머리줄 */
header {
  background: var(--head);
  background-image: none;
  box-shadow: none;
  color: var(--head-ink);
  padding: calc(env(safe-area-inset-top) + 6px) 14px 0;
}
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.head-row > div { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: #B8C7DA; }
.status.working .dot { background: #F2C14E; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status.working .dot { animation: none; } }
.icon-btn { background: none; border: 0; color: inherit; padding: 4px 6px; border-radius: 8px; font-size: 13px; opacity: .9; }

nav.tabs { display: flex; gap: 4px; margin-top: 4px; }
nav.tabs button {
  flex: 1; background: none; border: 0; color: var(--head-ink); opacity: .7;
  padding: 6px 0 7px; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent;
}
nav.tabs button[aria-selected="true"] { opacity: 1; border-bottom-color: #E8F0FA; }
nav.tabs .badge[hidden] { display: none; }
nav.tabs .badge {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
  border-radius: 9px; background: #F2C14E; color: #2A1F05; font-size: 11px; line-height: 18px;
}

main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pane { padding: 8px 12px 16px; }
.pane[hidden] { display: none; }

/* 대화 */
.day { text-align: center; margin: 14px 0 8px; font-size: 12px; color: var(--ink-soft); }
.msg { display: flex; flex-direction: column; margin: 6px 0; max-width: 88%; }
.msg .who { font-size: 12px; color: var(--ink-soft); margin: 0 6px 3px; }
.msg .bubble { padding: 8px 12px; border-radius: var(--radius-bubble); white-space: normal; }
.msg .time { font-size: 11px; color: var(--ink-soft); margin: 3px 8px 0; }
.msg.me { margin-left: auto; align-items: flex-end; }
.msg.me .bubble { border-bottom-right-radius: 6px; }
.msg.other .bubble { border-bottom-left-radius: 6px; }
.msg.choi .bubble { background: var(--vine); color: var(--vine-ink); }
.msg.kang .bubble { background: var(--kang); color: var(--kang-ink); }
.msg.unknown .bubble { background: var(--chip); }
.msg.agent { max-width: 94%; }
.msg.agent .bubble {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--agent-rule); border-radius: 10px;
}
.msg.bot { max-width: 100%; align-items: center; margin: 4px auto; }
.msg.bot .bubble { background: none; padding: 2px 8px; font-size: 12px; color: var(--ink-soft); text-align: center; }
.msg.bot .who, .msg.bot .time { display: none; }
.bubble p { margin: 0 0 6px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: 4px 0; padding-left: 20px; }
.bubble code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 5px; color: var(--ink); }
.bubble pre { background: var(--chip); color: var(--ink); padding: 8px 10px; border-radius: 8px; overflow-x: auto; font-size: 14px; margin: 6px 0; }
.bubble a { color: inherit; }
.bubble strong { font-weight: 700; }

/* 결정 요청 카드 (대화 안) */
.decision {
  background: var(--decide-bg); border: 1px solid var(--decide); border-radius: 12px;
  padding: 12px 14px; margin-top: 8px; color: var(--ink);
}
.decision h3 { margin: 0 0 4px; font-size: 14px; color: var(--decide); }
.decision .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.decision .opts button {
  border: 1px solid var(--decide); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 6px 12px; font-weight: 600; min-height: 38px; font-size: 14px;
}
.decision .votes { margin-top: 10px; font-size: 14px; color: var(--ink-soft); display: flex; gap: 14px; flex-wrap: wrap; }
.decision .votes b { color: var(--ok); }

/* 입력창 */
.composer {
  display: flex; gap: 6px; align-items: flex-end;
  padding: 7px 8px calc(env(safe-area-inset-bottom) + 7px);
  background: var(--surface); border-top: 1px solid var(--line);
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 18px;
  padding: 7px 12px; background: var(--bg); max-height: 140px; min-height: 36px;
  font-size: 15px; line-height: 1.45;
}
.composer button {
  border: 0; background: var(--vine); color: var(--vine-ink); flex: none;
  border-radius: 18px; padding: 0 12px; min-height: 36px; font-size: 14px; font-weight: 700;
}
.composer button:disabled { opacity: .5; }
.composer[hidden] { display: none; }
.composer .attach-btn {
  background: var(--chip); color: var(--ink); padding: 0; width: 36px; flex: none;
  font-size: 19px; line-height: 36px; font-weight: 400;
}
.composer-wrap { background: var(--surface); }
.composer-wrap[hidden] { display: none; }

/* 첨부 대기열 (보내기 전) */
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 0; border-top: 1px solid var(--line); }
.tray[hidden] { display: none; }
.tray .item {
  position: relative; flex: none; width: 76px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); padding: 4px; font-size: 11px; text-align: center;
}
.tray .item img { width: 66px; height: 54px; object-fit: cover; border-radius: 6px; display: block; }
.tray .item .ext { height: 54px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--ink-soft); }
.tray .item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.tray .item .x {
  position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
  border: 0; background: var(--ink); color: var(--bg); font-size: 15px; line-height: 28px; padding: 0;
}
.tray .item.up::after {
  content: "올리는 중"; position: absolute; inset: 0; border-radius: 10px;
  background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.tray .item.done::after {
  content: "✓"; position: absolute; inset: 0; border-radius: 10px;
  background: rgba(30,58,95,.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.tray-note { font-size: 13px; color: var(--ink-soft); padding: 4px 14px 0; }
.tray-note[hidden] { display: none; }

/* 말풍선 속 첨부 */
.atts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.atts:first-child { margin-top: 0; }
.att-img {
  display: block; border: 0; padding: 0; background: var(--chip); border-radius: 10px; overflow: hidden;
  width: 220px; max-width: 100%; min-height: 80px;
}
.att-img img { display: block; width: 100%; height: auto; }
.att-img .ph { display: block; padding: 28px 10px; font-size: 13px; color: var(--ink-soft); text-align: center; }
.att-file {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 240px; max-width: 100%;
  border: 1px solid rgba(127,127,127,.35); background: rgba(255,255,255,.12); color: inherit;
  border-radius: 10px; padding: 8px 10px; min-height: 48px;
}
.att-file .ext {
  flex: none; width: 38px; height: 38px; border-radius: 8px; background: var(--chip); color: var(--ink);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
}
.att-file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 15px; }
.att-file .sub { font-size: 12px; opacity: .75; }

/* 크게 보기 */
.viewer {
  position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50;
  display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer[hidden] { display: none; }
.viewer .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; gap: 10px; }
.viewer .bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.viewer .bar button, .viewer .bar a {
  background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px;
  text-decoration: none; font-size: 15px; flex: none; min-height: 40px;
}
.viewer .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; }
.viewer .stage img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* 회의록 */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
select, .toolbar input {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 38px; font-size: 14px;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 3px 10px; font-size: 13px; min-height: 32px;
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.log-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log-row .t { font-size: 12px; color: var(--ink-soft); padding-top: 2px; }
.log-row .route { font-size: 13px; font-weight: 600; }
.log-row .kind { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chip); margin-left: 6px; font-weight: 600; }
.log-row .kind.k-충돌, .log-row .kind.k-이견 { background: #F6DCD8; color: #7A2219; }
.log-row .kind.k-결정요청 { background: var(--decide-bg); color: var(--decide); }
.log-row .kind.k-완료, .log-row .kind.k-결정 { background: #DCEBD8; color: #24521F; }
@media (prefers-color-scheme: dark) {
  .log-row .kind.k-충돌, .log-row .kind.k-이견 { background: #3A1F1B; color: #F0A59B; }
  .log-row .kind.k-완료, .log-row .kind.k-결정 { background: #1F3320; color: #A6D79E; }
}
.log-row .body { margin-top: 2px; }

/* 결정 탭 */
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.dcard.waiting { border-color: var(--decide); }
.dcard .state { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.dcard.waiting .state { color: var(--decide); }
.dcard h3 { margin: 4px 0 8px; font-size: 15px; }
.dcard details { margin-top: 8px; }
.dcard summary { cursor: pointer; color: var(--ink-soft); font-size: 14px; }
.dcard pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; margin: 8px 0 0; }

.empty { text-align: center; color: var(--ink-soft); padding: 40px 16px; }
.error { background: #F6DCD8; color: #7A2219; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
@media (prefers-color-scheme: dark) { .error { background: #3A1F1B; color: #F0A59B; } }

/* 설정 */
.setup { padding: 20px 18px 40px; }
.setup h2 { font-size: 19px; margin: 6px 0 4px; }
.setup p.lead { color: var(--ink-soft); margin: 0 0 20px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field .hint { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.field input[type="text"], .field input[type="password"], .field input[type="number"] {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; min-height: 48px;
}
.who-pick { display: flex; gap: 10px; }
.who-pick label {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 700; background: var(--surface);
}
.who-pick input { accent-color: var(--head); width: 20px; height: 20px; }
.who-pick label:has(input:checked) { border-color: var(--head); }
.primary { width: 100%; border: 0; background: var(--head); color: var(--vine-ink); border-radius: 12px; padding: 14px; font-weight: 700; min-height: 52px; }
.link-btn { background: none; border: 0; color: var(--danger); padding: 12px 0; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <div>
        <div class="title">말씀함께 정책실</div>
        <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="status-text">연결 전</span></div>
      </div>
      <button class="icon-btn" id="open-setup" aria-label="설정">설정</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" data-tab="chat">대화</button>
      <button role="tab" aria-selected="false" data-tab="log">회의록</button>
      <button role="tab" aria-selected="false" data-tab="decide">결정<span class="badge" id="decide-badge" hidden></span></button>
    </nav>
  </header>

  <main id="main">
    <section class="pane" id="pane-chat"><div id="chat"></div></section>

    <section class="pane" id="pane-log" hidden>
      <div class="toolbar">
        <select id="log-date" aria-label="회의록 날짜"></select>
        <div class="chips" id="log-filter">
          <button aria-pressed="true" data-k="">전체</button>
          <button aria-pressed="false" data-k="충돌|이견">충돌·이견</button>
          <button aria-pressed="false" data-k="결정요청|결정">결정</button>
          <button aria-pressed="false" data-k="질문|답변">질문·답변</button>
        </div>
      </div>
      <div id="log"></div>
    </section>

    <section class="pane" id="pane-decide" hidden><div id="decide"></div></section>

    <section class="setup" id="pane-setup" hidden>
      <h2>정책실 연결</h2>
      <p class="lead">처음 한 번만 설정하면 됩니다. 이 정보는 이 휴대폰에만 저장됩니다.</p>
      <form id="setup-form">
        <div class="field">
          <label>나는</label>
          <div class="who-pick">
            <label><input type="radio" name="who" value="Choi" required> Choi</label>
            <label><input type="radio" name="who" value="Kang"> Kang</label>
          </div>
        </div>
        <div class="field">
          <label for="f-repo">정책 저장소</label>
          <input type="text" id="f-repo" placeholder="davidsjchoi/Policy" autocapitalize="off" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="f-issue">채팅방 이슈 번호</label>
          <input type="number" id="f-issue" inputmode="numeric" min="1" value="1" required>
        </div>
        <div class="field">
          <label for="f-token">접속키</label>
          <input type="password" id="f-token" placeholder="github_pat_로 시작하는 키" autocapitalize="off" autocomplete="off" spellcheck="false" required>
          <div class="hint">Choi가 만들어 준 키를 붙여 넣으세요. 휴대폰을 잃어버리면 Choi에게 알려 키를 폐기하세요.</div>
        </div>
        <button class="primary" type="submit">연결하기</button>
      </form>
      <button class="link-btn" id="forget" type="button">이 휴대폰에서 연결 정보 지우기</button>
    </section>
  </main>

  <div class="composer-wrap" id="composer-wrap">
    <div class="tray" id="tray" hidden aria-label="보낼 첨부"></div>
    <div class="tray-note" id="tray-note" hidden></div>
    <form class="composer" id="composer">
      <button type="button" class="attach-btn" id="attach" aria-label="파일·사진 첨부">＋</button>
      <input type="file" id="file" multiple hidden
        accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.docx,.xlsx,.pptx,.hwp,.hwpx">
      <textarea id="input" rows="1" placeholder="팀장에게 지시" aria-label="메시지"></textarea>
      <button type="submit" id="send">보내기</button>
    </form>
  </div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="첨부 크게 보기">
  <div class="bar">
    <span class="nm" id="viewer-name"></span>
    <span style="display:flex;gap:8px">
      <a id="viewer-save" download>저장</a>
      <button type="button" id="viewer-close">닫기</button>
    </span>
  </div>
  <div class="stage"><img id="viewer-img" alt=""></div>
</div>

<script>
/* ---------- 순수 함수: 파싱과 표시 ---------- */
const AGENT_RE = /<!-- malsseum-agent:([^ >]+) -->\n?/;
const FROM_RE = /<!-- malsseum-from:([^ >]+) -->\n?/;
const PEOPLE = ["Choi", "Kang"];

function classify(c) {
  const body = c.body || "";
  let m = body.match(AGENT_RE);
  if (m) return { kind: m[1] === "팀장" ? "agent" : "bot", name: m[1], text: body.replace(AGENT_RE, "") };
  m = body.match(FROM_RE);
  if (m) return { kind: "human", name: m[1], text: body.replace(FROM_RE, "") };
  return { kind: "human", name: "@" + (c.user && c.user.login || "알 수 없음"), text: body };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function inline(s) {
  // s 는 이미 이스케이프된 문자열
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

function md(text) {
  const out = [];
  const parts = String(text).split(/```[a-z]*\n?/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) { out.push("<pre>" + esc(part.replace(/\n$/, "")) + "</pre>"); return; }
    const lines = part.split("\n");
    let list = null, para = [];
    const flush = () => {
      if (para.length) { out.push("<p>" + para.map(l => inline(esc(l))).join("<br>") + "</p>"); para = []; }
      if (list) { out.push("<ul>" + list.map(l => "<li>" + inline(esc(l)) + "</li>").join("") + "</ul>"); list = null; }
    };
    for (const raw of lines) {
      const line = raw.replace(/\s+$/, "");
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      const h = line.match(/^#{1,6}\s+(.*)$/);
      if (!line.trim()) { flush(); continue; }
      if (li) { if (para.length) { const p = para; para = []; out.push("<p>" + p.map(l => inline(esc(l))).join("<br>") + "</p>"); } (list = list || []).push(li[1]); continue; }
      if (list) { out.push("<ul>" + list.map(l => "<li>" + inline(esc(l)) + "</li>").join("") + "</ul>"); list = null; }
      if (h) { flush(); out.push("<p><strong>" + inline(esc(h[1])) + "</strong></p>"); continue; }
      para.push(line);
    }
    flush();
  });
  return out.join("");
}

// 대화 속 결정 요청: "결정 요청 D-001: 쟁점" + "A. ..." "B. ..."
function parseDecisionRequest(text) {
  const head = text.match(/결정\s*요청\s*(D-\d+)\s*[:：]?\s*(.*)/);
  if (!head) return null;
  const options = [];
  for (const line of text.split("\n")) {
    const m = line.match(/^\s*([A-Z])[.)]\s*(.+)$/);
    if (m) options.push({ key: m[1], label: m[2] });
  }
  return { id: head[1], title: head[2].trim(), options };
}

// 사람 글 속 승인: "D-001 A 승인"
function parseApproval(text) {
  const m = text.match(/(D-\d+)\s*([A-Z])\s*안?\s*승인/);
  return m ? { id: m[1], key: m[2] } : null;
}

function tallyApprovals(items) {
  const votes = {}; // id -> {Choi: "A", Kang: "B"}
  for (const it of items) {
    if (it.kind !== "human" || !PEOPLE.includes(it.name)) continue;
    const a = parseApproval(it.text);
    if (a) { (votes[a.id] = votes[a.id] || {})[it.name] = a.key; }
  }
  return votes;
}

// 회의록 표 한 줄: | 10:15 | 법무 | 보안 | 질문 | 내용 |
function parseLog(mdText) {
  const rows = [];
  for (const line of mdText.split("\n")) {
    const m = line.match(/^\|\s*(\d{2}:\d{2})\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(.*?)\s*\|\s*$/);
    if (m) rows.push({ time: m[1], from: m[2], to: m[3], kind: m[4], body: m[5] });
  }
  return rows;
}

// 결정 문서
function parseDecisionDoc(name, mdText) {
  const title = (mdText.match(/^#\s+(.+)$/m) || [, name])[1];
  const state = (mdText.match(/^\|\s*상태\s*\|\s*([^|]+?)\s*\|/m) || [, "알 수 없음"])[1];
  const id = (name.match(/^(D-\d+)/) || title.match(/(D-\d+)/) || [, ""])[1];
  const options = [];
  const re = /^###\s*([A-Z])[.)]\s*(.+)$/gm;
  let m;
  while ((m = re.exec(mdText))) options.push({ key: m[1], label: m[2].trim() });
  return { id, title, state, options, waiting: /대기/.test(state) };
}

// 첨부 줄: "📎 [파일 이름](attachments/2026-10/07-185501-Choi-이름.jpg)"
const ATT_RE = /^\s*📎\s*\[([^\]]*)\]\((attachments\/[^)\s]+)\)\s*$/;
function splitAttachments(text) {
  const atts = [], keep = [];
  for (const line of String(text).split("\n")) {
    const m = line.match(ATT_RE);
    if (m) atts.push({ name: m[1] || m[2].split("/").pop(), path: m[2] });
    else keep.push(line);
  }
  return { text: keep.join("\n").replace(/\n+$/, ""), atts };
}
const IMG_EXT = /\.(jpe?g|png|gif|webp|heic|heif)$/i;
const isImagePath = p => IMG_EXT.test(p);
const extOf = n => ((String(n).match(/\.([a-z0-9]{1,5})$/i) || [, "파일"])[1]).toUpperCase();

// 저장소에 올릴 파일 이름: 글자·숫자·.-_ 만 남기고, 확장자는 지킨다
function safeName(name) {
  const m = String(name).match(/^(.*?)(\.[A-Za-z0-9]{1,5})?$/);
  let base = (m[1] || "file").normalize("NFC").replace(/[^\p{L}\p{N}._-]+/gu, "-").replace(/-+/g, "-").replace(/^[-.]+|[-.]+$/g, "");
  if (!base) base = "file";
  return base.slice(0, 50) + (m[2] || "").toLowerCase();
}
function attachmentPath(who, name, now = new Date()) {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" })
    .formatToParts(now).reduce((o, x) => (o[x.type] = x.value, o), {});
  return `attachments/${p.year}-${p.month}/${p.day}-${p.hour}${p.minute}${p.second}-${who}-${safeName(name)}`;
}
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(b / 1024)) + "KB";

const kst = iso => new Date(iso).toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit" });
const kstDay = iso => new Date(iso).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", weekday: "short" });

async function gh(path, opts = {}) {
  const res = await fetch("https://api.github.com/" + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + cfg.token,
      "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? { "Content-Type": "application/json" } : {})
    }
  });
  if (!res.ok) {
    const err = new Error(String(res.status));
    err.status = res.status;
    throw err;
  }
  if (opts.blob) return res.blob();
  return opts.raw ? res.text() : res.json();
}

function explain(err, what) {
  if (err.status === 401) return "접속키가 맞지 않거나 만료되었습니다. 설정에서 키를 다시 넣어 주세요.";
  if (err.status === 403 && what === "upload") return "접속키에 파일 올리기 권한이 없습니다. Choi에게 키 권한 중 Contents를 'Read and write'로 바꿔 달라고 하세요.";
  if ((err.status === 413 || err.status === 422) && what === "upload") return "파일이 너무 크거나 올릴 수 없는 형식입니다. 더 작은 파일로 다시 시도해 주세요.";
  if (err.status === 403) return "접속키에 이 기능 권한이 없습니다. Choi에게 키 권한(Issues 쓰기, Contents 읽기·쓰기)을 확인해 달라고 하세요.";
  if (err.status === 404) return "저장소나 이슈 번호를 찾을 수 없습니다. 설정의 저장소 이름과 이슈 번호를 확인해 주세요.";
  return "GitHub에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 열어 주세요.";
}

/* ---------- 첨부: 말풍선 안에 보이기 ---------- */
const blobCache = new Map();   // path -> objectURL
const blobLoading = new Map(); // path -> Promise

function attsHtml(atts) {
  if (!atts.length) return "";
  return `<div class="atts">${atts.map(a => isImagePath(a.path)
    ? `<button type="button" class="att-img" data-att="${esc(a.path)}" data-name="${esc(a.name)}" aria-label="${esc(a.name)} 크게 보기">${
        blobCache.has(a.path) ? `<img src="${blobCache.get(a.path)}" alt="${esc(a.name)}">` : `<span class="ph">사진 불러오는 중…</span>`}</button>`
    : `<button type="button" class="att-file" data-att="${esc(a.path)}" data-name="${esc(a.name)}">
         <span class="ext">${esc(extOf(a.name))}</span>
         <span style="min-width:0"><span class="nm" style="display:block">${esc(a.name)}</span><span class="sub">눌러서 열기</span></span></button>`
  ).join("")}</div>`;
}

function loadBlob(path) {
  if (blobCache.has(path)) return Promise.resolve(blobCache.get(path));
  if (!blobLoading.has(path)) {
    blobLoading.set(path, gh(`repos/${cfg.repo}/contents/${encPath(path)}`, { raw: true, blob: true })
      .then(b => { const u = URL.createObjectURL(b); blobCache.set(path, u); return u; })
      .finally(() => blobLoading.delete(path)));
  }
  return blobLoading.get(path);
}

function hydrateAttachments(root) {
  for (const el of root.querySelectorAll(".att-img[data-att]")) {
    if (el.querySelector("img")) continue;
    const path = el.dataset.att;
    loadBlob(path).then(u => {
      for (const t of document.querySelectorAll(`.att-img[data-att="${CSS.escape(path)}"]`)) {
        if (t.querySelector("img")) continue;
        const m = $("main"), near = m.scrollHeight - m.scrollTop - m.clientHeight < 120;
        t.innerHTML = `<img src="${u}" alt="${esc(t.dataset.name)}">`;
        if (near) t.querySelector("img").addEventListener("load", scrollBottom, { once: true });
      }
    }).catch(err => {
      const ph = el.querySelector(".ph");
      if (ph) ph.textContent = err.status === 404 ? "사진을 찾을 수 없습니다" : "사진을 불러오지 못했습니다 (눌러서 다시 시도)";
    });
  }
}

      comments = lists.flat();

      const fresh = await gh(`repos/${cfg.repo}/issues/${cfg.issue}/comments?per_page=100&since=${encodeURIComponent(since)}`);
      const seen = new Set(comments.map(c => c.id));

/* ---------- 첨부: 고르기와 올리기 ---------- */
const MAX_FILES = 6, MAX_BYTES = 25 * 1048576, IMG_MAX_SIDE = 2000;
let pending = []; // {id, file, name, preview, path?}

$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const picked = [...e.target.files];
  e.target.value = "";
  const notes = [];
  for (const f of picked) {
    if (pending.length >= MAX_FILES) { notes.push(`한 번에 ${MAX_FILES}개까지 보낼 수 있습니다.`); break; }
    let file = f;
    try { file = await shrinkImage(f); } catch (err) { /* 줄이지 못하면 원본 그대로 */ }
    if (file.size > MAX_BYTES) { notes.push(`${f.name}: ${fmtSize(f.size)} — 25MB보다 커서 뺐습니다.`); continue; }
    const isImg = /^image\//.test(file.type);
    pending.push({ id: Math.random().toString(36).slice(2), file, name: file.name, preview: isImg ? URL.createObjectURL(file) : null });
  }
  renderTray(notes.join(" "));
});

// 큰 사진은 긴 변 2000px JPEG 로 줄인다 (전송 속도, 저장소 용량, 팀장이 읽기 좋게)
async function shrinkImage(f) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(f.type)) return f;
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, side = Math.max(w, h);
    const needs = side > IMG_MAX_SIDE || f.size > 2.5 * 1048576 || /heic|heif/.test(f.type);
    if (!needs) return f;
    const k = Math.min(1, IMG_MAX_SIDE / side);
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
    if (!blob) return f;
    const name = f.name.replace(/\.[^.]+$/, "") + ".jpg";
    return new File([blob], name, { type: "image/jpeg" });
  } finally { URL.revokeObjectURL(url); }
}

function renderTray(note) {
  const tray = $("tray");
  tray.hidden = !pending.length;
  tray.innerHTML = pending.map(p => `<div class="item ${p.state || ""}" data-id="${p.id}">
      ${p.preview ? `<img src="${p.preview}" alt="">` : `<div class="ext">${esc(extOf(p.name))}</div>`}
      <div class="nm">${esc(p.name)}</div>
      <button type="button" class="x" data-remove="${p.id}" aria-label="${esc(p.name)} 빼기">×</button></div>`).join("");
  $("tray-note").hidden = !note;
  $("tray-note").textContent = note || "";
  $("input").placeholder = pending.length ? "설명 (선택)" : "팀장에게 지시";
}

  if (!b || $("send").disabled) return;
  const p = pending.find(x => x.id === b.dataset.remove);
  if (p && p.preview) URL.revokeObjectURL(p.preview);
  pending = pending.filter(x => x !== p);
  renderTray();
});

const toBase64 = file => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => no(r.error);
  r.readAsDataURL(file);
});

async function uploadOne(p) {
  const content = await toBase64(p.file);
  let path = attachmentPath(cfg.who, p.name);
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      await gh(`repos/${cfg.repo}/contents/${encPath(path)}`, {
        method: "PUT",
        body: JSON.stringify({ message: `첨부: ${p.name} (${cfg.who})`, content })
      });
      return path;
    } catch (err) {
      // 같은 이름이 이미 있거나(422), 다른 커밋과 겹치면(409) 이름을 바꿔 다시 시도
      if ((err.status === 409 || err.status === 422) && attempt < 2) {
        path = path.replace(/(\.[^./]+)?$/, m => `-${attempt + 2}${m}`);
        await new Promise(r => setTimeout(r, 800));
        continue;
      }
      throw err;
    }
  }
}

$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && !pending.length) return;
  $("send").disabled = true; $("attach").disabled = true;
  try {
    // 1) 첨부를 하나씩 올린다 (동시에 올리면 커밋이 겹쳐 실패할 수 있음)
    for (const p of pending) {
      if (p.path) continue; // 지난번에 이미 올라간 것
      p.state = "up"; renderTray();
      try { p.path = await uploadOne(p); p.state = "done"; renderTray(); }
      catch (err) { p.state = ""; renderTray(); throw Object.assign(err, { what: "upload" }); }
    }
    // 2) 글을 올린다. 첨부는 "📎 [이름](경로)" 줄로 붙인다.
    const lines = pending.map(p => `📎 [${p.name.replace(/[\[\]]/g, "")}](${p.path})`);
    const body = [text, lines.join("\n")].filter(Boolean).join("\n\n");
    const c = await gh(`repos/${cfg.repo}/issues/${cfg.issue}/comments`, {
      method: "POST",
      body: JSON.stringify({ body: `<!-- malsseum-from:${cfg.who} -->\n${body}` })
    });
    // 방금 올린 사진은 다시 받지 않도록 미리보기를 그대로 쓴다
    for (const p of pending) { if (p.preview) blobCache.set(p.path, p.preview); }
    pending = []; renderTray();
    comments.push(c);
    input.value = ""; autoGrow();
    renderChat(); scrollBottom();
    setTimeout(loadStatus, 4000);
  } catch (err) {
    alert(explain(err, err.what));
  } finally {
    $("send").disabled = false; $("attach").disabled = false;
  }
});

/* 회의록 */
let logFiles = null, logFilter = "";
async function loadLog() {
  const box = $("log"), sel = $("log-date");
  try {
    if (!logFiles) {
      const list = await gh(`repos/${cfg.repo}/contents/discussions`);
      logFiles = list.filter(f => /^\d{4}-\d{2}-\d{2}\.md$/.test(f.name)).map(f => f.name).sort().reverse();
      sel.innerHTML = logFiles.map(n => `<option>${esc(n.replace(".md", ""))}</option>`).join("");
    }
    if (!logFiles.length) { box.innerHTML = '<div class="empty">아직 회의록이 없습니다.<br>팀장이 일을 시작하면 이곳에 에이전트끼리 나눈 대화가 쌓입니다.</div>'; return; }
    const text = await gh(`repos/${cfg.repo}/contents/discussions/${sel.value}.md`, { raw: true });
    let rows = parseLog(text);
    if (logFilter) { const ks = logFilter.split("|"); rows = rows.filter(r => ks.includes(r.kind)); }
    box.innerHTML = rows.length ? rows.slice().reverse().map(r => `
      <div class="log-row"><div class="t">${esc(r.time)}</div>
        <div><div class="route">${esc(r.from)} → ${esc(r.to)}<span class="kind k-${esc(r.kind)}">${esc(r.kind)}</span></div>
        <div class="body">${inline(esc(r.body))}</div></div></div>`).join("")
      : '<div class="empty">이 조건에 맞는 기록이 없습니다.</div>';
  } catch (err) {
    if (err.status === 404) { box.innerHTML = '<div class="empty">아직 회의록이 없습니다.<br>팀장이 일을 시작하면 이곳에 에이전트끼리 나눈 대화가 쌓입니다.</div>'; return; }
    box.innerHTML = `<div class="error">${esc(explain(err))}</div>`;
  }
}
$("log-date").addEventListener("change", loadLog);
$("log-filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of $("log-filter").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
  logFilter = b.dataset.k; loadLog();
});

/* 결정 */
async function loadDecisions() {
  const box = $("decide");
  try {
    const list = (await gh(`repos/${cfg.repo}/contents/decisions`)).filter(f => /^D-\d+.*\.md$/.test(f.name));
    if (!list.length) { box.innerHTML = '<div class="empty">결정할 일이 아직 없습니다.<br>팀장이 결정 요청을 올리면 이곳에 모입니다.</div>'; updateBadge(0); return; }
    const docs = await Promise.all(list.map(async f => {
      const t = await gh(`repos/${cfg.repo}/contents/decisions/${encodeURIComponent(f.name)}`, { raw: true });
      return { ...parseDecisionDoc(f.name, t), raw: t, file: f.name };
    }));
    docs.sort((a, b) => (b.waiting - a.waiting) || b.file.localeCompare(a.file));
    const votes = tallyApprovals(comments.map(c => classify(c)));
    updateBadge(docs.filter(d => d.waiting).length);
    box.innerHTML = docs.map(d => {
      const v = votes[d.id] || {};
      const btns = d.waiting && d.options.length ? `<div class="decision" style="margin-top:6px">
          <div class="opts">${d.options.map(o => `<button type="button" data-approve="${esc(d.id)} ${esc(o.key)}">${esc(o.key)}. ${esc(o.label)}</button>`).join("")}</div>
          <div class="votes">${["Choi", "Kang"].map(p => v[p] ? `<span>${p}: <b>${esc(v[p])} 승인</b></span>` : `<span>${p}: 아직</span>`).join("")}</div></div>` : "";
      return `<article class="dcard ${d.waiting ? "waiting" : ""}">
        <div class="state">${esc(d.state)}</div><h3>${esc(d.title)}</h3>${btns}
        <details><summary>전체 내용 보기</summary><pre>${esc(d.raw)}</pre></details></article>`;
    }).join("");
  } catch (err) {
    if (err.status === 404) { box.innerHTML = '<div class="empty">결정할 일이 아직 없습니다.<br>팀장이 결정 요청을 올리면 이곳에 모입니다.</div>'; updateBadge(0); return; }
    box.innerHTML = `<div class="error">${esc(explain(err))}</div>`;
  }
}
function updateBadge(n) { const b = $("decide-badge"); b.hidden = !n; b.textContent = n; }

/* 설정 */
function openSetup() {
  for (const t of ["chat", "log", "decide"]) $("pane-" + t).hidden = true;
  $("pane-setup").hidden = false; $("composer-wrap").hidden = true;
  if (cfg) {
    $("f-repo").value = cfg.repo; $("f-issue").value = cfg.issue; $("f-token").value = cfg.token;
    const r = document.querySelector(`input[name=who][value="${cfg.who}"]`); if (r) r.checked = true;
  }
}
$("open-setup").addEventListener("click", openSetup);
$("setup-form").addEventListener("submit", async e => {
  e.preventDefault();
  const next = {
    who: document.querySelector("input[name=who]:checked").value,
    repo: $("f-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, ""),
    issue: parseInt($("f-issue").value, 10),
    token: $("f-token").value.trim()
  };
  const prev = cfg; cfg = next;
  try {
    await gh(`repos/${cfg.repo}/issues/${cfg.issue}`);
  } catch (err) {
    cfg = prev; alert(explain(err)); return;
  }
  if (!store.set(cfg)) window.__memCfg = cfg; // 저장이 막힌 브라우저에서는 이번 사용 동안만 기억
  logFiles = null;
  start();
});
$("forget").addEventListener("click", () => {
  if (!confirm("이 휴대폰에서 접속키와 설정을 지울까요?")) return;
  store.clear(); cfg = null; comments = [];
  $("f-token").value = "";
  openSetup();
});

/* 시작 */
let timer = null;
function start() {
  showTab("chat");
  loadChat(true); loadStatus(); loadDecisions();
  clearInterval(timer);
  timer = setInterval(() => {
    if (document.hidden || !cfg) return;
    if (current === "chat") loadChat(false);
    loadStatus();
  }, 15000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg) { loadChat(false); loadStatus(); } });

if (cfg) start(); else openSetup();
</script>
</body>
